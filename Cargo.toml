[package]
name = "pm3"
version = "4.1.0"
edition = "2024"
rust-version = "1.87"
description = "Podman Compose project manager"
license = "GPL-3.0-only"
repository = "https://github.com/ExposedCat/pm3"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
crossterm = { version = "0.29", default-features = false, features = ["events", "event-stream"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[profile.release]
opt-level = "s"
codegen-units = 1
lto = "fat"
panic = "abort"
strip = true
