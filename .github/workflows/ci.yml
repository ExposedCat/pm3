name: CI

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      force_release:
        description: Force release even when package metadata did not change
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TARGET: x86_64-unknown-linux-musl

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  release:
    name: Build and release
    runs-on: ubuntu-latest
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect pending release
        id: package
        env:
          FORCE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.force_release }}
        run: ./scripts/detect-pending-release.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Setup Rust
        if: steps.package.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RELEASE_TARGET }}

      - name: Install build tooling
        if: steps.package.outputs.changed == 'true'
        run: sudo apt-get update && sudo apt-get install -y rpm musl-tools

      - name: Build static binary
        if: steps.package.outputs.changed == 'true'
        run: |
          cargo build --release --target "$RELEASE_TARGET"
          install -Dm0755 "target/$RELEASE_TARGET/release/pm3" dist/pm3
          dist/pm3 help

      - name: Build RPM
        if: steps.package.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: ./scripts/build-rpm.sh

      - name: Prepare release assets
        if: steps.package.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: ./scripts/prepare-release-assets.sh

      - name: Create GitHub release
        if: steps.package.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: ./scripts/create-release.sh
