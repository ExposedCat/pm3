services:
  built:
    build:
      context: ./built
      dockerfile: Containerfile
    depends_on:
      prebuilt:
        condition: service_started
      delayed-health:
        condition: service_healthy
    ports:
      - "3101:3000"

  prebuilt:
    image: node:22-alpine
    command: ["node", "/app/prebuilt.js"]
    working_dir: /app
    volumes:
      - ./prebuilt:/app:ro,Z
    ports:
      - "3102:3000"

  delayed-health:
    image: node:22-alpine
    command: ["node", "/app/delayed-health.js"]
    working_dir: /app
    volumes:
      - ./delayed-health:/app:ro,Z
    ports:
      - "3103:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs = require('node:fs'); const readyAt = Number(fs.readFileSync('/tmp/pm3-ready-at', 'utf8')); process.exit(Date.now() >= readyAt ? 0 : 1);",
        ]
      interval: 1s
      timeout: 1s
      retries: 10
