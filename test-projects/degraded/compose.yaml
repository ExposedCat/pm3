services:
  main:
    build:
      context: ./main
      dockerfile: Containerfile
    depends_on:
      delayed-health:
        condition: service_healthy
    ports:
      - "3201:3000"

  delayed-health:
    image: node:22-alpine
    command: [ "node", "/app/delayed-health.js" ]
    working_dir: /app
    volumes:
      - ./delayed-health:/app:ro,Z
    ports:
      - "3202:3000"
    healthcheck:
      test: [ "CMD", "node", "-e", "const fs = require('node:fs'); const path = '/tmp/pm3-healthcheck-count'; const count = fs.existsSync(path) ? Number(fs.readFileSync(path, 'utf8')) + 1 : 1; fs.writeFileSync(path, String(count)); process.exit(count >= 2 ? 1 : 0);" ]
      interval: 10s
      timeout: 5s
      retries: 3

x-pm3:
  startup:
    mode: watcher
    required_services:
      - main
