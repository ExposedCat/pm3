services:
  main:
    build:
      context: ./main
      dockerfile: Containerfile
    depends_on:
      delayed-health:
        condition: service_healthy
    ports:
      - "3401:3000"

  prebuilt:
    image: node:22-alpine
    command: [ "node", "/app/prebuilt.js" ]
    working_dir: /app
    volumes:
      - ./prebuilt:/app:ro,Z
    ports:
      - "3402:3000"

  delayed-health:
    image: node:22-alpine
    command: [ "node", "/app/delayed-health.js" ]
    working_dir: /app
    volumes:
      - ./delayed-health:/app:ro,Z
    ports:
      - "3403:3000"
    healthcheck:
      test: [ "CMD", "node", "-e", "process.exit(1);" ]
      interval: 1s
      timeout: 5s
      retries: 3

x-pm3:
  hooks:
    all:
      degraded: ../hooks/zenity-state.sh
      healthy: ../hooks/zenity-state.sh
      started: ../hooks/zenity-state.sh
      starting: ../hooks/zenity-state.sh
      stopped: ../hooks/zenity-state.sh
      stopping: ../hooks/zenity-state.sh
  startup:
    mode: watcher
    required_services:
      - prebuilt
